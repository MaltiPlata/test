o retirement-me never pays taxes on what it grows into.",infoTitle:'why "now" beats "later" in your 20s',bars:[{label:"start at 25",value:"$525k",h:104,color:st},{label:"start at 35",value:"$245k",h:52,color:vt},{label:"start at 45",value:"$104k",h:24,color:Gt}],infoNote:"$300/mo to age 65, illustrative ~7%/yr. starting early is the whole cheat code."},{id:"credit",name:"credit score",cat:"borrow",bg:vt,short:"your financial gpa. banks check it before trusting you. yes, you can raise it.",eli5:"it’s a report card on one question: when you borrow, do you give it back on time? do that, and your grade goes up.",sentence:"i set my card to autopay in full, and my credit score quietly climbed 60 points.",infoTitle:"what the score is made of",bars:[{label:"pay on time",value:"35%",h:98,color:st},{label:"amounts owed",value:"30%",h:84,color:vt},{label:"history length",value:"15%",h:42,color:Gt},{label:"other",value:"20%",h:56,color:Ii}],infoNote:"paying on time + keeping balances low ≈ two-thirds of the game."},{id:"apr",name:"apr vs apy",cat:"borrow",bg:Gt,short:"apr is what borrowing costs you. apy is what saving earns you. same letters, opposite teams.",eli5:"apr = the rent you pay to use someone else’s money. apy = the rent someone pays YOU for parking your money at their bank. you want a low apr and a high apy.",sentence:"my credit card charges 24% apr, but my savings account pays 4% apy — so paying the card first is a no-brainer.",infoTitle:"same $1,000, one year",bars:[{label:"card debt 24% apr",value:"-$240",h:100,color:Gt},{label:"checking 0% apy",value:"$0",h:6,color:Ii},{label:"hysa 4% apy",value:"+$40",h:30,color:st}],infoNote:"illustrative — but yes, debt interest almost always beats savings interest."},{id:"vesting",name:"vesting",cat:"work",bg:st,short:"your job promised you stock or 401(k) match — vesting is the waiting period before it’s actually yours.",eli5:'your boss says "stay 4 years and this treasure chest is yours." every year you stay, another chunk  from the stash instead of borrowing snacks at 24% interest.",sentence:"my emergency fund turned a blown tire from a crisis into an inconvenience.",infoTitle:"build it in stages",bars:[{label:"$500 starter",value:"stage 1",h:30,color:Gt},{label:"1 month costs",value:"stage 2",h:56,color:vt},{label:"3-6 months",value:"stage 3",h:100,color:st}],infoNote:"park it in a hysa — earning apy while it waits."},{id:"savings",name:"savings account",cat:"save",bg:vt,short:"a bank account that pays you to park cash. the regular kind pays crumbs — the high-yield kind (hysa) pays real money.",eli5:"it’s a jar the bank borrows from, and pays you rent for the privilege. a big-bank savings account pays almost no rent. a high-yield one (hysa) pays real rent — same jar, way more money, zero extra effort.",sentence:"i moved my rainy-day cash from my big bank’s savings to a hysa and started earning like ten times more for doing nothing.",infoTitle:"same $10k, one year",bars:[{label:"checking 0%",value:"$0",h:6,color:Ii},{label:"big-bank 0.4%",value:"+$40",h:20,color:vt},{label:"hysa 4.5%",value:"+$450",h:100,color:st}],infoNote:"rates move with the fed, and a hysa is still fdic-insured — it’s not investing, just a smarter parking spot."}],Va=["efund","roth","index","savings","apr","credit","vesting","escrow","prenup","postnup"],Cr=[...bd].sort((m,z)=>Va.indexOf(m.id)-Va.indexOf(z.id));function Qa({footer:m=!1}){return s.jsxs("span",{className:m?"logo logo--footer":"logo",children:[s.jsx("span",{className:"logo-malti",children:"malti"}),s.jsx("span",{className:"logo-slash",children:"/"}),s.jsx("span",{className:"logo-plata",children:"plata"})]})}function ef(){return s.jsxs("nav",{className:"nav",children:[s.jsx(Qa,{}),s.jsxs("div",{className:"nav-links",children:[s.jsx("a",{href:"./topics/index.html",children:"topics"}),s.jsx("a",{href:"./guides/index.html",children:"guides"}),s.jsx("a",{href:"#dictionary",children:"dictionary"}),s.jsx("a",{href:"#pros",children:"find a pro"}),s.jsx("a",{
