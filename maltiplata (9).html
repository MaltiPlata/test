o retirement-me never pays taxes on what it grows into.",infoTitle:'why "now" beats "later" in your 20s',bars:[{label:"start at 25",value:"$525k",h:104,color:he},{label:"start at 35",value:"$245k",h:52,color:ve},{label:"start at 45",value:"$104k",h:24,color:xe}],infoNote:"$300/mo to age 65, illustrative ~7%/yr. starting early is the whole cheat code."},{id:"credit",name:"credit score",cat:"borrow",bg:ve,short:"your financial gpa. banks check it before trusting you. yes, you can raise it.",eli5:"it’s a report card on one question: when you borrow, do you give it back on time? do that, and your grade goes up.",sentence:"i set my card to autopay in full, and my credit score quietly climbed 60 points.",infoTitle:"what the score is made of",bars:[{label:"pay on time",value:"35%",h:98,color:he},{label:"amounts owed",value:"30%",h:84,color:ve},{label:"history length",value:"15%",h:42,color:xe},{label:"other",value:"20%",h:56,color:$i}],infoNote:"paying on time + keeping balances low ≈ two-thirds of the game."},{id:"apr",name:"apr vs apy",cat:"borrow",bg:xe,short:"apr is what borrowing costs you. apy is what saving earns you. same letters, opposite teams.",eli5:"apr = the rent you pay to use someone else’s money. apy = the rent someone pays YOU for parking your money at their bank. you want a low apr and a high apy.",sentence:"my credit card charges 24% apr, but my savings account pays 4% apy — so paying the card first is a no-brainer.",infoTitle:"same $1,000, one year",bars:[{label:"card debt 24% apr",value:"-$240",h:100,color:xe},{label:"checking 0% apy",value:"$0",h:6,color:$i},{label:"hysa 4% apy",value:"+$40",h:30,color:he}],infoNote:"illustrative — but yes, debt interest almost always beats savings interest."},{id:"vesting",name:"vesting",cat:"work",bg:he,short:"your job promised you stock or 401(k) match — vesting is the waiting period before it’s actually yours.",eli5:'your boss says "stay 4 years and this treasure chest is yours." every year you stay, another chunk unlocks. leave early, and the locked part stays behind.',sentence:"i’m 75% vested, so if i quit today i’d walk away with three-quarters of my match.",infoTitle:"a typical 4-year vest",bars:[{label:"year 1",value:"25%",h:28,color:ve},{label:"year 2",value:"50%",h:52,color:ve},{label:"year 3",value:"75%",h:78,color:he},{label:"year 4",value:"100%",h:104,color:he}],infoNote:"check your vest date before you accept a new offer — timing can be worth thousands."},{id:"index",name:"index fund",cat:"invest",bg:ve,short:"instead of betting on one company, you buy a tiny slice of all of them at once.",eli5:"don’t pick one cupcake and hope it’s good — buy a crumb of every cupcake in the bakery. some flop, most don’t, and you never cry over one bad cupcake.",sentence:"i stopped stock-picking and just auto-buy an index fund every payday.",infoTitle:"one stock vs. the whole market",bars:[{label:"that one stock",value:"???",h:40,color:xe},{label:"index fund",value:"~7-10%/yr avg",h:88,color:he}],infoNote:"historical long-run average, not a promise. boring wins surprisingly often."},{id:"escrow",name:"escrow",cat:"legal",bg:xe,short:"a neutral third party holds the money until everyone does what they promised.",eli5:"you and your friend are trading pokémon cards, so a trusted friend holds BOTH cards and only hands them over when you both deliver. nobody can run off mid-trade.",sentence:"our deposit sat in escrow until the sellers actually handed over the keys.",infoTitle:"how escrow flows",steps:[{n:1,text:"buyer puts money in the middle"},{n:2,text:"neutral party holds it (nobody can touch)"},{n:3,text:"seller delivers the thing"},{n:4,text:"money released — everyone’s safe"}],infoNote:"you’ll meet escrow when renting, buying a home, or freelancing with contracts."},{id:"efund",name:"emergency fund",cat:"save",bg:he,short:'money whose only job is "just in case." boring name, life-changing effect.',eli5:"a snack stash for rainy days — when the car breaks or the job wobbles, you eat from the stash instead of borrowing snacks at 24% interest.",sentence:"my emergency fund turned a blown tire from a crisis into an inconvenience.",infoTitle:"build it in stages",bars:[{label:"$500 starter",value:"stage 1",h:30,color:xe},{label:"1 month costs",value:"stage 2",h:56,color:ve},{label:"3-6 months",value:"stage 3",h:100,color:he}],infoNote:"park it in a hysa — earning apy while it waits."},{id:"savings",name:"savings account",cat:"save",bg:ve,short:"a bank account that pays you to park cash. the regular kind pays crumbs — the high-yield kind (hysa) pays real money.",eli5:"it’s a jar the bank borrows from, and pays you rent for the privilege. a big-bank savings account pays almost no rent. a high-yield one (hysa) pays real rent — same jar, way more money, zero extra effort.",sentence:"i moved my rainy-day cash from my big bank’s savings to a hysa and started earning like ten times more for doing nothing.",infoTitle:"same $10k, one year",bars:[{label:"checking 0%",value:"$0",h:6,color:$i},{label:"big-bank 0.4%",value:"+$40",h:20,color:ve},{label:"hysa 4.5%",value:"+$450",h:100,color:he}],infoNote:"rates move with the fed, and a hysa is still fdic-insured — it’s not investing, just a smarter parking spot."},{id:"net-worth",name:"net worth",cat:"basics",bg:he,short:"everything you own, minus everything you owe. the one real scoreboard for your money.",eli5:"add up your bank accounts, investments, and stuff worth real money. subtract every debt you owe. what’s left is your net worth — the only number that tells the whole truth about where you stand.",sentence:"my net worth was technically negative after student loans, but tracking it monthly showed me it was climbing anyway.",infoTitle:"the one formula",bars:[{label:"what you own",value:"assets",h:100,color:he},{label:"what you owe",value:"-debts",h:55,color:xe},{label:"net worth",value:"the real number",h:70,color:ve}],infoNote:"it can be negative early on and that’s fine — the trend matters more than the starting number."},{id:"sole-proprietorship",name:"sole proprietorship",cat:"business",bg:ve,short:"the default business type — no paperwork, no cost, but zero separation between you and the business.",eli5:"if you sell your art on the side without filing anything, congratulations — you’re already a sole proprietor. it’s not a choice you make, it’s what you are by default the moment you make your first sale.",sentence:"i was a sole proprietor for a full year before i ever filed any paperwork — that’s completely normal.",infoTitle:"the tradeoff",steps:[{n:1,text:"zero cost, zero paperwork to start"},{n:2,text:"business income = your personal income, taxed once"},{n:3,text:"no legal separation — personal assets aren’t protected"},{n:4,text:'most people "upgrade" to an llc once real money is on the line'}],infoNote:"perfect for testing an idea — just don’t stay here once real risk shows up."},{id:"partnership",name:"partnership (business)",cat:"business",bg:xe,short:"two or more people running a business together — profits, losses, and liability are usually shared.",eli5:"like a sole proprietorship, but for two or more people. you each report your share of the profit on your own taxes — but in a basic partnership you can also be on the hook for your partner’s business mistakes, not just your own.",sentence:"my co-founder and i started as a simple partnership before we ever got a written agreement — a mistake we fixed fast.",infoTitle:"protect yourself first",steps:[{n:1,text:"get a written partnership agreement — always, even with friends"},{n:2,text:"spell out who owns what % and who decides what"},{n:3,text:"a general partnership offers zero liability protection"},{n:4,text:"an llc taxed as a partnership fixes that — ask a pro"}],infoNote:"money and friendship both survive partnerships better with things in writing."},{id:"llc",name:"llc (business structure)",cat:"business",bg:he,short:"a legal wrapper that separates your business’s money & liability from your personal money.",eli5:'without one, your business and you are the same wallet — if the business gets sued, they can come after your stuff too. an LLC builds a wall between "business you" and "real you."',sentence:"i formed an llc before i took my first paying client, so my business debts stay separate from my apartment deposit.",infoTitle:"llc vs. sole proprietor",steps:[{n:1,text:"sole proprietor: you = the business, zero separation"},{n:2,text:"llc: a wall between business debts & your stuff"},{n:3,text:"costs ~$50–500 to file, varies by state"},{n:4,text:"still taxed on your personal return (pass-through)"}],infoNote:"not required to start — but it’s cheap insurance once real money moves through the business."},{id:"ein",name:"ein (business tax id)",cat:"business",bg:xe,short:"your business’s social security number — free from the irs, needed to open a business bank account.",eli5:"just like you have a social security number, your business gets its own 9-digit id so the irs (and banks) can tell your business apart from you.",sentence:"i got my ein in five minutes on the irs website, for free, and used it to open my business checking account.",infoTitle:"do i need one?",steps:[{n:1,text:"hiring employees? yes."},{n:2,text:"forming an llc or corp? yes."},{n:3,text:"sole proprietor, no employees? optional"},{n:4,text:"opening a business account? most banks require it"}],infoNote:"it’s 100% free at irs.gov — anyone charging you for this is charging for a form you can file yourself."},{id:"corporation",name:"corporation (c-corp & s-corp)",cat:"business",bg:ve,short:"a business that legally exists separately from its owners — the strongest liability wall, but the most paperwork.",eli5:"an llc is a decent wall between you and the business. a corporation is a whole separate building — it can own things, owe things, and get sued, almost entirely apart from you. it just costs more in paperwork and formality to keep standing.",sentence:"we converted to a c-corp once we wanted outside investors — it’s basically required for that path.",infoTitle:"c-corp vs. s-corp",steps:[{n:1,text:"c-corp: the business pays taxes, then you’re taxed again on what you take out"},{n:2,text:"s-corp: profits pass through to your personal taxes once, like an llc"},{n:3,text:"c-corp is standard if you want to raise venture capital"},{n:4,text:"most small businesses never need to go past an llc"}],infoNote:"this is the one to bring an actual accountant into — the tax difference is real money."},{id:"trademark",name:"trademark",cat:"business",bg:xe,short:"legal ownership of your business name, logo, or slogan — stops others from using something confusingly similar.",eli5:"it’s like calling dibs, but the government backs you up. once your name or logo is trademarked, someone else can’t legally launch a copycat brand that confuses your customers.",sentence:"i trademarked my business name before i spent a dollar on branding, so i wouldn’t fall in love with a name i’d have to abandon later.",infoTitle:"the basics",steps:[{n:1,text:"search the uspto database before you fall in love with a name"},{n:2,text:'using "™" costs nothing — it just means "i’m claiming this"'},{n:3,text:'the "®" symbol requires an actual registered trademark'},{n:4,text:"registering runs a few hundred dollars — worth it once the brand is real"}],infoNote:"do the free search early — renaming a business after year two is brutal."},{id:"business-loan",name:"business loan",cat:"business",bg:he,short:"borrowed money for your business — often needs a personal guarantee, meaning you’re on the hook too.",eli5:'a business loan sounds like it’s the business’s problem, not yours. often it isn’t: lenders frequently require a "personal guarantee," meaning if the business can’t pay, they can come after your personal money anyway — the same wall an llc builds can get quietly punched through.',sentence:"i almost signed a business loan without reading the personal guarantee clause — that one line changes everything.",infoTitle:"before you sign",steps:[{n:1,text:'ask directly: "does this require a personal guarantee?"'},{n:2,text:"compare the apr, not just the monthly payment"},{n:3,text:"a business line of credit is more flexible than a lump sum"},{n:4,text:"lenders want revenue history — hard for a brand-new business"}],infoNote:"a loan isn’t the only way to fund a start — revenue from real customers is the cheapest capital there is."},{id:"1099-w2",name:"1099 vs. w-2",cat:"business",bg:ve,short:"w-2 = employee, taxes withheld for you. 1099 = contractor, you owe your own taxes.",eli5:'a w-2 job is like a bill that already has the tip added — your employer takes taxes out before you see the money. a 1099 is "pay the full bill yourself": nothing’s withheld, so you owe the irs directly, usually every quarter.',sentence:"my day job sends me a w-2, but my freelance clients send me 1099s — so i set aside my own tax money from those.",infoTitle:"the withholding gap",bars:[{label:"w-2 paycheck",value:"taxes withheld",h:40,color:ve},{label:"1099 payment",value:"0% withheld",h:100,color:xe}],infoNote:"set aside ~25–30% of every 1099 payment for taxes — the irs still expects quarterly estimates."},{id:"self-employment-tax",name:"self-employment tax",cat:"business",bg:he,short:"the extra ~15.3% you owe on business income — it covers both halves of social security & medicare.",eli5:"at a normal job, you and your employer each pay half of social security & medicare. when you work for yourself, you’re both the employee AND the employer — so you pay both halves.",sentence:"i knew i’d owe income tax on my side hustle, but self-employment tax caught me off guard the first year.",infoTitle:"the two halves",bars:[{label:"employee half",value:"7.65%",h:50,color:ve},{label:"employer half",value:"7.65%",h:50,color:xe},{label:"self-employed",value:"15.3%",h:100,color:he}],infoNote:"it’s on top of regular income tax — budget for both when you price your work."},{id:"business-bank",name:"business bank account",cat:"business",bg:xe,short:"a separate account for business money only — keeps your finances (and your tax season) sane.",eli5:'mixing business & personal money in one account is like throwing your receipts, your rent, and a friend’s venmo request all in the same shoebox — technically it’s all "in there," but good luck sorting it out in april.',sentence:"the first thing i did after forming my llc was open a business checking account, so client payments never touch my personal money.",infoTitle:"why bother",steps:[{n:1,text:"clean books = an easier tax season"},{n:2,text:"protects your llc’s legal wall"},{n:3,text:"looks more legit to clients & lenders"},{n:4,text:"makes profit or loss actually visible"}],infoNote:'most banks offer free business checking with no minimum — you don’t need to be "big" to open one.'},{id:"profit-margin",name:"profit margin",cat:"business",bg:ve,short:"what’s actually left after costs — as a percentage of what you brought in.",eli5:'you sell a candle for $20. it costs you $8 to make. your profit margin is the $12 left over, shown as a percent of the $20 — 60%. it’s the "how much do i actually keep" number.',sentence:"i raised my prices when i realized my profit margin on custom orders was basically zero after materials and my time.",infoTitle:"the math",bars:[{label:"revenue",value:"$20",h:100,color:ve},{label:"costs",value:"-$8",h:40,color:xe},{label:"profit",value:"$12 (60%)",h:60,color:he}],infoNote:'price for margin, not just to "cover costs" — you need room for taxes, slow months, and your own paycheck.'},{id:"break-even",name:"break-even point",cat:"business",bg:he,short:"the exact number of sales where you stop losing money and start making it.",eli5:"if it costs you $200 a month just to keep your shop open, and you profit $20 per sale, you need to sell 10 things before you’ve even covered your costs. sale #11 is your first real dollar.",sentence:"once i mapped my break-even point, i finally knew the real number i needed
